<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escáner de productos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.4/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0f1210;
    --panel: #1a1e1a;
    --border: #2e332d;
    --text: #f2ede4;
    --muted: #8a8578;
    --muted2: #6b6759;
    --accent: #c9a227;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 16px;
  }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  /* ---- Selector de cliente ---- */
  .client-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .client-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .client-row { display: flex; gap: 8px; }
  .client-row input {
    flex: 1;
    background: #11140f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 15px;
  }
  .client-row button {
    background: var(--accent);
    color: #1a1500;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .client-active {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .client-active .name { font-size: 16px; font-weight: 700; color: var(--accent); }
  .client-active .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .change-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .recent { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .recent-chip {
    background: #22261f;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  /* ---- Escaneo ---- */
  .scan-btn {
    width: 100%;
    background: var(--accent);
    color: #1a1500;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .scan-btn.stop { background: #3a3f38; color: var(--text); }
  .scan-btn:disabled { opacity: .4; cursor: not-allowed; }

  #reader {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
    display: none;
  }
  #reader.active { display: block; }

  .status { font-size: 12px; color: var(--muted); margin-bottom: 14px; min-height: 16px; }

  .summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .empty { text-align: center; padding: 40px 0; color: var(--muted2); font-size: 14px; }

  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    padding: 0;
  }
  .card-name:focus { outline: none; }
  .card-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card-meta .sku { color: var(--accent); font-weight: 700; }
  .card-meta .sep { color: var(--muted2); margin: 0 5px; }

  .qty-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #22261f;
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .qty-val { min-width: 20px; text-align: center; font-weight: 700; font-size: 15px; }

  .del-btn {
    background: none; border: none; color: #8a5a5a;
    font-size: 18px; cursor: pointer; padding: 0 2px; flex-shrink: 0;
  }

  #manual-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center;
    padding: 20px; z-index: 10;
  }
  #manual-overlay.active { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    width: 100%; max-width: 360px;
  }
  .modal h3 { margin: 0 0 10px; font-size: 15px; }
  .modal .code { font-family: monospace; color: var(--accent); font-size: 13px; margin-bottom: 10px; }
  .modal input {
    width: 100%;
    background: #11140f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
  }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-save { background: var(--accent); color: #1a1500; }
  .btn-cancel { background: #2e332d; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>Escáner de productos</h1>

  <div class="client-box" id="clientBox"></div>

  <button class="scan-btn" id="scanBtn" disabled>📷 Escanear código de barras</button>
  <div id="reader"></div>
  <div class="status" id="status"></div>

  <div class="summary">
    <span id="count">0 productos</span>
    <button class="clear-btn" id="clearBtn">Vaciar lista</button>
  </div>

  <div id="list"></div>
</div>

<div id="manual-overlay">
  <div class="modal">
    <h3>Producto no identificado</h3>
    <div class="code" id="modalCode"></div>
    <input id="modalName" placeholder="Nombre del producto" autofocus>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Cancelar</button>
      <button class="btn-save" id="modalSave">Agregar</button>
    </div>
  </div>
</div>

function sanitizeDocId(code) {
  // las claves de Realtime Database no admiten . # $ [ ] /
  return code.replace(/[.#$\[\]\/]/g, "_").trim();
}

function persistCurrentClient() {
  try {
    if (currentClient) localStorage.setItem("current-client", currentClient);
    else localStorage.removeItem("current-client");
  } catch (e) {}
}

function getCurrentList() {
  if (!currentClient) return [];
  if (!clients[currentClient]) clients[currentClient] = [];
  return clients[currentClient];
}

async function saveCurrentList() {
  if (!fbDb || !currentClient) return;
  const id = sanitizeDocId(currentClient);
  try {
    await fbDb.ref("clients/" + id).set({
      code: currentClient,
      items: getCurrentList(),
      updatedAt: Date.now()
    });
  } catch (e) {
    statusEl.textContent = "No se pudo guardar en la nube, reintentá.";
  }
}

async function loadClientsIndex() {
  if (!fbDb) return;
  try {
    const snap = await fbDb.ref("clients").once("value");
    const val = snap.val() || {};
    Object.keys(val).forEach(id => {
      const data = val[id] || {};
      clients[data.code || id] = data.items || [];
    });
    renderClientBox();
  } catch (e) {}
}

function subscribeCurrentClient() {
  if (currentRef && currentListener) { currentRef.off("value", currentListener); currentRef = null; currentListener = null; }
  if (!fbDb || !currentClient) return;
  const id = sanitizeDocId(currentClient);
  currentRef = fbDb.ref("clients/" + id);
  currentListener = currentRef.on("value", (snap) => {
    const data = snap.val();
    if (data) {
      clients[currentClient] = data.items || [];
      render();
      renderClientBox();
    }
  }, () => {});
}

      }
    });
    clientBox.querySelectorAll(".recent-chip").forEach(chip => {
      chip.addEventListener("click", () => setClient(chip.getAttribute("data-code")));
    });
    scanBtn.disabled = true;
  } else {
    const n = getCurrentList().reduce((a, i) => a + i.qty, 0);
    clientBox.innerHTML = `
      <div class="client-active">
        <div>
          <div class="name">Cliente: ${currentClient}</div>
          <div class="sub">${n} unidades cargadas</div>
        </div>
        <button class="change-btn" id="changeClientBtn">Cambiar</button>
      </div>
    `;
    document.getElementById("changeClientBtn").addEventListener("click", () => {
      stopScan();
      currentClient = null;
      persistCurrentClient();
      renderClientBox();
      render();
    });
    scanBtn.disabled = false;
  }
}

function setClient(code) {
  currentClient = code;
  if (!clients[code]) clients[code] = [];
  persistCurrentClient();
  renderClientBox();
  render();
  subscribeCurrentClient();
}

function render() {
  const scanned = getCurrentList();
  countEl.textContent = scanned.reduce((a, i) => a + i.qty, 0) + (scanned.length === 1 ? " unidad" : " unidades");
  if (!currentClient) {
    listEl.innerHTML = '<div class="empty">Ingresá un código de cliente para empezar</div>';
    return;
  }
  if (scanned.length === 0) {
    listEl.innerHTML = '<div class="empty">Todavía no escaneaste nada para este cliente</div>';
    return;
  }
  listEl.innerHTML = scanned.map((item, i) => `
    <div class="card">
      <div class="card-info">
        <input class="card-name" value="${item.name.replace(/"/g, '&quot;')}" data-idx="${i}" data-field="name">
        <div class="card-meta">${item.sku ? `<span class="sku">SKU ${item.sku}</span><span class="sep">·</span>` : ""}${item.format || ""}</div>
      </div>
      <div class="qty-ctrl">
        <div class="qty-btn" data-idx="${i}" data-action="dec">−</div>
        <div class="qty-val">${item.qty}</div>
        <div class="qty-btn" data-idx="${i}" data-action="inc">+</div>
      </div>
      <button class="del-btn" data-idx="${i}" data-action="del">✕</button>
    </div>
  `).join("");
}

listEl.addEventListener("click", (e) => {
  const action = e.target.getAttribute("data-action");
  if (!action || !currentClient) return;
  const idx = parseInt(e.target.getAttribute("data-idx"), 10);
  const scanned = getCurrentList();
  if (action === "inc") scanned[idx].qty += 1;
  if (action === "dec") scanned[idx].qty = Math.max(1, scanned[idx].qty - 1);
  if (action === "del") scanned.splice(idx, 1);
  render();
  renderClientBox();
  saveCurrentList();
});

let nameSaveTimer = null;
listEl.addEventListener("input", (e) => {
  if (e.target.getAttribute("data-field") === "name" && currentClient) {
    const idx = parseInt(e.target.getAttribute("data-idx"), 10);
    getCurrentList()[idx].name = e.target.value;
    clearTimeout(nameSaveTimer);
    nameSaveTimer = setTimeout(saveCurrentList, 500);
  }
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (!currentClient) return;
  const scanned = getCurrentList();
  if (scanned.length === 0) return;
  if (confirm("¿Vaciar la lista de este cliente?")) {
    clients[currentClient] = [];
    render();
    renderClientBox();
    saveCurrentList();
  }
});

function addProduct(name, format, ean, sku) {
  if (!currentClient) return;
  const scanned = getCurrentList();
  const existing = scanned.find(s => s.ean && ean && s.ean === ean);
  if (existing) {
    existing.qty += 1;
  } else {
    scanned.unshift({ name, format: format || "", ean: ean || "", sku: sku || "", qty: 1 });
  }
  render();
  renderClientBox();
  saveCurrentList();
}

// ---- Escáner ----
let html5QrCode;
let scanning = false;
const readerEl = document.getElementById("reader");
const statusEl = document.getElementById("status");

const manualOverlay = document.getElementById("manual-overlay");
const modalCode = document.getElementById("modalCode");
const modalName = document.getElementById("modalName");
let pendingCode = null;

function showManual(code) {
  pendingCode = code;
  modalCode.textContent = "Código: " + code;
  modalName.value = "";
  manualOverlay.classList.add("active");
  setTimeout(() => modalName.focus(), 50);
}

document.getElementById("modalCancel").addEventListener("click", () => {
  manualOverlay.classList.remove("active");
  pendingCode = null;
  scheduleResume();
});

document.getElementById("modalSave").addEventListener("click", () => {
  const name = modalName.value.trim();
  if (name && pendingCode) {
    addProduct(name, "", pendingCode, "");
  }
  manualOverlay.classList.remove("active");
  pendingCode = null;
  scheduleResume();
});

let scanLocked = false;
let resumeTimer = null;

function onScanSuccess(decodedText) {
  if (scanLocked) return;
  scanLocked = true;
  if (html5QrCode && scanning) {
    try { html5QrCode.pause(true); } catch (e) {}
  }

  const product = EAN_MAP[decodedText];
  if (product) {
    addProduct(product.name, product.format, decodedText, product.sku);
    statusEl.textContent = "✓ " + product.name + " — enfocá el próximo código";
    scheduleResume();
  } else {
    showManual(decodedText);
    statusEl.textContent = "Código no identificado, agregalo a mano";
    // se reanuda cuando cierre el modal (ver botones de abajo)
  }
}

function scheduleResume() {
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    scanLocked = false;
    if (html5QrCode && scanning) {
      try { html5QrCode.resume(); } catch (e) {}
    }
  }, 1200);
}

async function startScan() {
  if (!currentClient) return;
  if (typeof Html5Qrcode === "undefined") {
    statusEl.textContent = "No se pudo cargar el lector de códigos. Revisá tu conexión y recargá la página.";
    return;
  }
  try {
    html5QrCode = new Html5Qrcode("reader");
    readerEl.classList.add("active");
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 260, height: 160 } },
      (decodedText) => { onScanSuccess(decodedText); },
      () => {}
    );
    scanning = true;
    scanLocked = false;
    scanBtn.textContent = "⏹ Detener escaneo";
    scanBtn.classList.add("stop");
    statusEl.textContent = "Apuntá al código de barras...";
  } catch (err) {
    statusEl.textContent = "No se pudo acceder a la cámara. Revisá los permisos.";
    readerEl.classList.remove("active");
  }
}

async function stopScan() {
  clearTimeout(resumeTimer);
  scanLocked = false;
  if (html5QrCode && scanning) {
    try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
  }
  scanning = false;
  readerEl.classList.remove("active");
  scanBtn.textContent = "📷 Escanear código de barras";
  scanBtn.classList.remove("stop");
  statusEl.textContent = "";
}

scanBtn.addEventListener("click", () => {
  if (!currentClient) return;
  if (scanning) stopScan(); else startScan();
});

renderClientBox();
render();

async function initDb() {
  try {
    fbApp = firebase.initializeApp(firebaseConfig);
    fbDb = firebase.database();
  } catch (e) {
    fbDb = null;
  }
  if (!fbDb) {
    statusEl.textContent = "No se pudo conectar al guardado en la nube. Los datos pueden no persistir entre dispositivos.";
    return;
  }
  dbReady = true;
  await loadClientsIndex();
  if (currentClient) subscribeCurrentClient();
}
initDb();
</script>
